name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/ConnectSound.Core.Tests

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build src/ConnectSound.Desktop -c Release

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: dotnet workload install android
      - run: dotnet build src/ConnectSound.Android -c Release
